{% load static %}

<div id="toast-component" class="toast-component toast-hidden" popover="manual">
    <div class="toast-icon" aria-hidden="true">
        <span id="toast-icon">✓</span>
    </div>

    <div class="toast-content">
        <h3 id="toast-title" class="toast-title"></h3>
        <p id="toast-message" class="toast-message"></p>
    </div>

    <button type="button" class="toast-close" onclick="hideToast()" aria-label="Close notification">
        <span aria-hidden="true">×</span>
    </button>
</div>

<script src="{% static 'js/toast.js' %}"></script>

{% if messages %}
    {% for message in messages %}
        <script>
            showToast(
                "Success",
                "{{ message|escapejs }}",
                "{{ message.tags|default:'normal' }}"
            );
        </script>
    {% endfor %}
{% endif %}
